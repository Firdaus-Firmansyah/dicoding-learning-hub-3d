<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 - Menambahkan Elemen ke DOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #edf2f8;
      --clay-card: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --clay-card-shadow: 12px 12px 24px rgba(166, 180, 200, 0.45),
                          -10px -10px 22px rgba(255, 255, 255, 0.95),
                          inset 3px 3px 6px rgba(255, 255, 255, 0.9),
                          inset -3px -3px 6px rgba(166, 180, 200, 0.15);
      
      --clay-btn-shadow: 6px 6px 14px rgba(14, 165, 233, 0.35),
                         -4px -4px 10px rgba(255, 255, 255, 0.9),
                         inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-inset-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.45),
                           inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #bae6fd 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #d1fae5 0%, transparent 40%),
                  var(--clay-bg);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 860px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: #bae6fd;
      color: #0369a1;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 8px;
    }

    .card {
      background: var(--clay-card);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--clay-card-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-3px);
    }

    ol {
      background: #f1f5f9;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-md);
      box-shadow: var(--clay-inset-shadow);
      padding: 1.5rem 2.8rem;
      margin: 1.25rem 0;
    }

    li {
      margin-bottom: 0.6rem;
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
    }

    li.new-item {
      color: #0369a1;
      font-weight: 800;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    button {
      font-family: inherit;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.6);
      padding: 0.85rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: var(--clay-btn-shadow);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(14, 165, 233, 0.45);
    }

    button:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    button.btn-mint {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 6px 6px 14px rgba(16, 185, 129, 0.35), -4px -4px 10px rgba(255, 255, 255, 0.9);
    }

    button.btn-gray {
      background: #94a3b8;
      color: white;
      box-shadow: 6px 6px 14px rgba(148, 163, 184, 0.35), -4px -4px 10px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">🍳 Modul 07</span>
      <h1>Menambahkan Elemen ke DOM</h1>
      <p style="color: var(--text-muted); font-weight: 500;">Praktik <code>appendChild()</code> dan <code>insertBefore()</code></p>
    </header>

    <div class="card">
      <h2 style="font-size: 1.2rem; font-weight: 800; color: #0369a1; margin-bottom: 0.5rem;" id="name">Langkah-langkah Memasak Air</h2>
      <p style="color: var(--text-muted); font-weight: 500;">Perhatikan urutan langkah di bawah ini:</p>

      <ol id="daftar">
        <li id="awal">Masukkan air ke dalam wadah.</li>
        <li id="akhir">Matikan kompor.</li>
      </ol>

      <div class="btn-group">
        <button id="btnInsertBefore">➕ Sisipkan: Rebus air (insertBefore)</button>
        <button id="btnAppendChild" class="btn-mint">🍵 Tambahkan di Akhir: Tuang ke cangkir (appendChild)</button>
        <button id="btnReset" class="btn-gray">🔄 Reset Daftar</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
