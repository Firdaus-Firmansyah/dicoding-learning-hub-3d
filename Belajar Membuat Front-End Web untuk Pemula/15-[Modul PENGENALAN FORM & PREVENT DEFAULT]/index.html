<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 - Pengenalan ke Form & Prevent Default</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #edf2f8;
      --clay-card: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --clay-card-shadow: 12px 12px 24px rgba(166, 180, 200, 0.45),
                          -10px -10px 22px rgba(255, 255, 255, 0.95),
                          inset 3px 3px 6px rgba(255, 255, 255, 0.9),
                          inset -3px -3px 6px rgba(166, 180, 200, 0.15);
      
      --clay-btn-shadow: 6px 6px 14px rgba(16, 185, 129, 0.35),
                         -4px -4px 10px rgba(255, 255, 255, 0.9),
                         inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-inset-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.45),
                           inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #d1fae5 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #dbeafe 0%, transparent 40%),
                  var(--clay-bg);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 8px;
    }

    .card {
      background: var(--clay-card);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      margin-bottom: 2rem;
      box-shadow: var(--clay-card-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .form-element {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: #1e1b4b;
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #f1f5f9;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-sm);
      box-shadow: var(--clay-inset-shadow);
      color: #1e293b;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      background: #ffffff;
      border-color: #10b981;
      box-shadow: inset 2px 2px 4px rgba(16, 185, 129, 0.2), 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    input[type="submit"] {
      font-family: inherit;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.7);
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 800;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      box-shadow: var(--clay-btn-shadow);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      margin-top: 0.5rem;
    }

    input[type="submit"]:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(16, 185, 129, 0.45);
    }

    input[type="submit"]:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.4rem;
      background: #ecfdf5;
      border: 2.5px solid #a7f3d0;
      border-radius: var(--radius-md);
      box-shadow: var(--clay-inset-shadow);
    }

    #messageAfterSubmit {
      color: #065f46;
      font-weight: 800;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">📝 Modul 15</span>
      <h1>Form & Prevent Default</h1>
      <p style="color: var(--text-muted); font-weight: 500;">Menangani Event Submit Form Tanpa Me-reload Halaman Web</p>
    </header>

    <div class="card">
      <h2 style="font-size: 1.25rem; font-weight: 800; color: #1e1b4b; margin-bottom: 1.25rem; text-align: center;">📋 Formulir Data Diri</h2>

      <form id="formDataDiri">
        <div class="form-element">
          <label for="inputNama">👤 Nama Panggilan:</label>
          <input type="text" id="inputNama" name="nama" placeholder="Masukkan nama Anda..." required>
        </div>

        <div class="form-element">
          <label for="inputDomisili">🏠 Kota Domisili:</label>
          <input type="text" id="inputDomisili" name="domisili" placeholder="Contoh: Jakarta / Bandung / Surabaya..." required>
        </div>

        <div class="form-element">
          <input type="submit" value="✨ Kirim Data Diri">
        </div>
      </form>

      <div class="result-box">
        <p style="font-size: 0.85rem; color: #047857; font-weight: 700; margin-bottom: 0.25rem;">Hasil Pengiriman Form:</p>
        <h3 id="messageAfterSubmit">Silakan isi formulir di atas dan klik submit...</h3>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
