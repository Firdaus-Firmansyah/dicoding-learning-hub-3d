<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18 - Event onChange, onCopy, dan onPaste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #edf2f8;
      --clay-card: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --clay-card-shadow: 12px 12px 24px rgba(166, 180, 200, 0.45),
                          -10px -10px 22px rgba(255, 255, 255, 0.95),
                          inset 3px 3px 6px rgba(255, 255, 255, 0.9),
                          inset -3px -3px 6px rgba(166, 180, 200, 0.15);
      
      --clay-btn-shadow: 6px 6px 14px rgba(16, 185, 129, 0.35),
                         -4px -4px 10px rgba(255, 255, 255, 0.9),
                         inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-inset-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.45),
                           inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #fef3c7 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #d1fae5 0%, transparent 40%),
                  var(--clay-bg);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 8px;
    }

    .card {
      background: var(--clay-card);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      margin-bottom: 2rem;
      box-shadow: var(--clay-card-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .form-element {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: #1e1b4b;
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #f1f5f9;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-sm);
      box-shadow: var(--clay-inset-shadow);
      color: #1e293b;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      background: #ffffff;
      border-color: #f59e0b;
      box-shadow: inset 2px 2px 4px rgba(245, 158, 11, 0.2), 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    input[readonly] {
      background: #e2e8f0;
      cursor: not-allowed;
      color: #64748b;
      border-style: dashed;
    }

    .captcha-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 0.75rem 0;
    }

    .captcha-container img {
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.35);
      height: 46px;
    }

    input[type="submit"] {
      font-family: inherit;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.7);
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 800;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      box-shadow: var(--clay-btn-shadow);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    input[type="submit"]:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(16, 185, 129, 0.45);
    }

    input[type="submit"]:active:not(:disabled) {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    input[type="submit"]:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: var(--clay-inset-shadow);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .toast-log {
      background: #e2e8f0;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-sm);
      box-shadow: var(--clay-inset-shadow);
      padding: 1.2rem;
      font-family: 'Fira Code', monospace;
      color: #1e1b4b;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">🛡️ Modul 18</span>
      <h1>onChange, onCopy, dan onPaste</h1>
      <p style="color: var(--text-muted); font-weight: 500;">Validasi Captcha & Deteksi Aksi Clipboard Pengguna</p>
    </header>

    <div class="card">
      <form id="formDataDiri" autocomplete="off">
        <!-- Field Copy -->
        <div class="form-element" id="fieldCopy">
          <label for="inputCopy">📋 <i>Copy</i> teks di bawah ini (Coba blok lalu tekan Ctrl+C):</label>
          <input id="inputCopy" type="text" name="copy" value="Hello World! Coding Camp 2026" readonly>
        </div>

        <!-- Field Paste -->
        <div class="form-element" id="fieldPaste">
          <label for="inputPaste">📥 <i>Paste</i> teks ke kotak ini (Tekan Ctrl+V):</label>
          <input id="inputPaste" type="text" name="paste" placeholder="Tempel teks di sini...">
        </div>

        <!-- Field Captcha dengan onChange -->
        <div class="form-element" id="fieldCaptcha">
          <label for="inputCaptcha">🧩 Tulis <i>captcha</i> berikut:</label>
          <div class="captcha-container">
            <img src="https://raw.githubusercontent.com/dicodingacademy/a315-web-pemula-labs/shared-files/captcha.png" alt="Captcha PRNU">
            <span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">(Teks: <b style="color: #1e1b4b;">PRNU</b>)</span>
          </div>
          <input id="inputCaptcha" type="text" name="captcha" placeholder="Tulis captcha lalu tekan Enter atau klik di luar kotak...">
        </div>

        <div class="form-element">
          <input id="submitButton" type="submit" value="✨ Submit Data" disabled>
        </div>
      </form>

      <div class="toast-log" id="eventLog">
        [Log Clipboard & Captcha]: Menunggu aksi pengguna...
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
