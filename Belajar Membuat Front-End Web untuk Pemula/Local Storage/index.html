<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #edf2f8;
      --clay-card: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --clay-card-shadow: 12px 12px 24px rgba(166, 180, 200, 0.45),
                          -10px -10px 22px rgba(255, 255, 255, 0.95),
                          inset 3px 3px 6px rgba(255, 255, 255, 0.9),
                          inset -3px -3px 6px rgba(166, 180, 200, 0.15);
      
      --clay-btn-shadow: 6px 6px 14px rgba(99, 102, 241, 0.35),
                         -4px -4px 10px rgba(255, 255, 255, 0.9),
                         inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-btn-danger-shadow: 6px 6px 14px rgba(244, 63, 94, 0.35),
                                -4px -4px 10px rgba(255, 255, 255, 0.9),
                                inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-inset-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.45),
                           inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #e0e7ff 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #dbeafe 0%, transparent 40%),
                  var(--clay-bg);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .card {
      background: var(--clay-card);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      text-align: center;
      box-shadow: var(--clay-card-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 8px;
    }

    .counter-display {
      background: #f1f5f9;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-md);
      box-shadow: var(--clay-inset-shadow);
      padding: 2rem 1.5rem;
      margin: 2rem 0;
    }

    .counter-display p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .counter-display h2 {
      font-size: 4.5rem;
      font-family: 'Fira Code', monospace;
      color: #4f46e5;
      font-weight: 800;
      line-height: 1;
    }

    .button-group {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-sm);
      border: 2px solid rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    #incrementButton {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      flex: 2;
      box-shadow: var(--clay-btn-shadow);
    }

    #incrementButton:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(99, 102, 241, 0.45);
    }

    #incrementButton:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.25);
    }

    #clear {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      flex: 1;
      box-shadow: var(--clay-btn-danger-shadow);
    }

    #clear:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(244, 63, 94, 0.45);
    }

    #clear:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.25);
    }

    .info-box {
      margin-top: 2rem;
      font-size: 0.88rem;
      color: #1e40af;
      background: #eff6ff;
      border-radius: var(--radius-sm);
      box-shadow: var(--clay-inset-shadow);
      padding: 1.2rem;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="badge">🌐 Modul: Persistent Storage</span>
    <h1>Local Storage</h1>
    <p style="color: var(--text-muted); font-size: 0.92rem; font-weight: 500;">Data tersimpan permanen di browser meskipun tab / browser ditutup.</p>

    <div class="counter-display">
      <p>Kamu sudah menekan tombol sebanyak:</p>
      <h2 id="count">0</h2>
    </div>

    <div class="button-group">
      <button id="incrementButton">➕ Tambah Nilai</button>
      <button id="clear">🗑️ Hapus</button>
    </div>

    <div class="info-box">
      💡 <b>Tips Belajar:</b> Coba refresh halaman atau tutup tab dan buka kembali, nilai counter akan <b>tetap tersimpan</b> karena menggunakan <code>localStorage</code>.
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
