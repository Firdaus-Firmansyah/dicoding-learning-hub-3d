<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Mengubah Konten HTML (Cube World)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #edf2f8;
      --clay-card: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --clay-card-shadow: 12px 12px 24px rgba(166, 180, 200, 0.45),
                          -10px -10px 22px rgba(255, 255, 255, 0.95),
                          inset 3px 3px 6px rgba(255, 255, 255, 0.9),
                          inset -3px -3px 6px rgba(166, 180, 200, 0.15);
      
      --clay-btn-shadow: 6px 6px 14px rgba(245, 158, 11, 0.35),
                         -4px -4px 10px rgba(255, 255, 255, 0.9),
                         inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      
      --clay-inset-shadow: inset 4px 4px 8px rgba(166, 180, 200, 0.45),
                           inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 10%, #fef3c7 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #ede9fe 0%, transparent 40%),
                  var(--clay-bg);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 860px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
      box-shadow: 4px 4px 10px rgba(166, 180, 200, 0.3), -3px -3px 8px rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 8px;
    }

    .card {
      background: var(--clay-card);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--clay-card-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card:hover {
      transform: translateY(-3px);
    }

    #main {
      text-align: center;
      padding: 1rem;
    }

    #judul {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.5rem;
    }

    #gambar {
      border-radius: 18px;
      margin: 1.25rem 0;
      box-shadow: 8px 8px 20px rgba(166, 180, 200, 0.45);
      border: 3px solid white;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 100%;
      height: auto;
    }

    #caption {
      font-size: 1.05rem;
      color: #334155;
      margin-bottom: 1.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0;
    }

    .button button {
      width: 260px;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 6px 6px 14px rgba(59, 130, 246, 0.35), -4px -4px 10px rgba(255, 255, 255, 0.9);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .button button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(59, 130, 246, 0.45);
    }

    .button button:active:not(:disabled) {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    .button button:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: var(--clay-inset-shadow);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .control-panel {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 1.5rem 0;
      padding-top: 1.5rem;
      border-top: 2px solid rgba(166, 180, 200, 0.25);
    }

    .control-btn {
      font-family: inherit;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.7);
      padding: 0.85rem 1.4rem;
      font-weight: 800;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: var(--clay-btn-shadow);
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .control-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 8px 8px 18px rgba(245, 158, 11, 0.45);
    }

    .control-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.2);
    }

    #links {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: #f1f5f9;
      border-radius: var(--radius-md);
      box-shadow: var(--clay-inset-shadow);
      border: 2px solid rgba(255, 255, 255, 0.9);
      text-align: left;
    }

    #links a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }

    #links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">🎲 Modul 08</span>
      <h1>Mengubah Konten & Atribut HTML</h1>
      <p style="color: var(--text-muted); font-weight: 500;">Studi Kasus Halaman "Cube World"</p>
    </header>

    <div class="card">
      <div id="main">
        <h2 id="judul">Its Cube Time!</h2>
        <img id="gambar"
             src="https://raw.githubusercontent.com/dicodingacademy/a315-web-pemula-labs/shared-files/homepage-dicoding-challenge-illustration.png"
             alt="Its a rubiks cube!" width="300" height="215">
        <p id="caption"><b>Sudah siap untuk memecahkan teka-teki permainan tersebut?</b></p>
        
        <div class="button-group">
          <div class="button"><button id="btnSejarah">Sejarah</button></div>
          <div class="button"><button id="btnPermainan">Permainan</button></div>
          <div class="button"><button id="btnFunFact"><i>Fun Fact</i></button></div>
          <div class="button"><button id="btnPlay" disabled="disabled">Play (Coming Soon)</button></div>
          <div class="button"><button id="btnExit">Exit</button></div>
        </div>

        <div class="control-panel">
          <button class="control-btn" id="btnUbahKonten">🚀 Ubah Konten & Aktifkan Play via JS</button>
          <button class="control-btn" id="btnResetKonten" style="background: #94a3b8; box-shadow: 6px 6px 14px rgba(148, 163, 184, 0.35);">🔄 Reset Konten</button>
        </div>

        <div id="links">
          <p style="font-weight: 700; margin-bottom: 0.5rem; color: #1e1b4b;">Situs lainnya yang tidak kalah menarik:</p>
          <ul style="list-style-position: inside; color: #475569;">
            <li><a href="http://www.dicoding.com" id="dicodingLink">Dicoding</a></li>
            <li><a href="http://www.google.com" id="googleLink">Google</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
